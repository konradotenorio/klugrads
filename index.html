<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>RadRef — Referências em Ultrassonografia</title>
<meta name="description" content="Referência rápida de medidas, técnicas e cálculos em ultrassonografia. Ferramenta educacional — não substitui o julgamento clínico.">

<!-- PWA -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d1014">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<!-- iOS / standalone -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RadRef">
<meta name="application-name" content="RadRef">
<style>
  :root{
    --bg:#0d1014;
    --bg-elev:#161b22;
    --bg-elev2:#1c232c;
    --row:#171d25;
    --row-alt:#131820;
    --line:#252d38;
    --txt:#e8edf3;
    --txt-dim:#9aa7b5;
    --txt-faint:#67748422;
    --accent:#33b3a6;
    --accent-soft:#33b3a61f;
    --accent-2:#5aa9e6;
    --danger:#e06c75;
    --shadow:0 10px 40px rgba(0,0,0,.5);
    --radius:16px;
    font-size:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #16313044, transparent 60%),
      var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
    overflow:hidden;
  }
  #app{
    width:min(440px,100vw);
    height:100vh;
    height:100dvh;
    background:var(--bg);
    display:flex;flex-direction:column;
    position:relative;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  /* ---------- Header ---------- */
  header{
    padding:14px 18px 10px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--bg-elev),var(--bg));
    position:relative;flex:0 0 auto;
  }
  .brand{font-weight:700;font-size:1.08rem;letter-spacing:.3px;}
  .brand b{color:var(--accent);}
  .subtitle{font-size:.66rem;color:var(--txt-dim);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
  .back,.home{
    position:absolute;top:0;bottom:0;display:flex;align-items:center;
    color:var(--accent);font-size:.92rem;font-weight:600;cursor:pointer;
    padding:0 16px;user-select:none;
  }
  .back{left:0;}
  .home{right:0;font-size:1.15rem;}
  .back:active,.home:active{opacity:.5;}
  /* ---------- Segmented (faixa etária) ---------- */
  .seg-wrap{padding:12px 14px 6px;flex:0 0 auto;}
  .seg-label{font-size:.6rem;color:var(--txt-dim);letter-spacing:1.5px;text-transform:uppercase;margin:0 4px 7px;}
  .seg{
    display:flex;background:var(--bg-elev);border-radius:11px;padding:3px;gap:3px;
    border:1px solid var(--line);
  }
  .seg button{
    flex:1;border:0;background:transparent;color:var(--txt-dim);
    padding:8px 4px;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;
    transition:.18s;font-family:inherit;
  }
  .seg button.on{background:var(--accent);color:#04201d;box-shadow:0 2px 10px var(--accent-soft);}
  /* ---------- Search ---------- */
  .search{padding:6px 14px 10px;flex:0 0 auto;}
  .search input{
    width:100%;border:1px solid var(--line);background:var(--bg-elev);
    color:var(--txt);padding:11px 14px;border-radius:11px;font-size:.92rem;font-family:inherit;
    outline:none;transition:.18s;
  }
  .search input::placeholder{color:var(--txt-dim);}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  /* ---------- Scroll body ---------- */
  .scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:78px;}
  .scroll::-webkit-scrollbar{width:7px;}
  .scroll::-webkit-scrollbar-thumb{background:#2c3642;border-radius:4px;}
  /* ---------- List ---------- */
  .group-title{
    font-size:.66rem;color:var(--txt-dim);letter-spacing:1.4px;text-transform:uppercase;
    padding:16px 20px 7px;font-weight:700;
  }
  .row{
    display:flex;align-items:center;gap:13px;padding:14px 18px;
    border-bottom:1px solid var(--line);cursor:pointer;transition:.12s;
    background:var(--row);
  }
  .row:nth-child(even){background:var(--row-alt);}
  .row:active{background:var(--accent-soft);}
  .row .ic{
    width:34px;height:34px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    color:var(--accent);
  }
  .row .ic svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
  .row .txt{flex:1;min-width:0;}
  .row .nm{font-weight:600;font-size:.94rem;}
  .row .ab{font-size:.72rem;color:var(--txt-dim);margin-top:1px;}
  .row .chev{color:#4b5663;font-size:1.1rem;}
  .empty{text-align:center;color:var(--txt-dim);padding:50px 20px;font-size:.9rem;}
  /* ---------- Detail ---------- */
  .d-section-label{
    font-size:.62rem;color:var(--txt-dim);letter-spacing:1.4px;text-transform:uppercase;
    padding:15px 20px 5px;font-weight:700;
  }
  .d-age{padding:6px 20px 4px;font-weight:700;font-size:.96rem;}
  .meas-table{width:100%;border-collapse:collapse;font-size:.86rem;}
  .meas-table th{
    background:var(--bg-elev2);color:var(--txt-dim);font-weight:600;font-size:.72rem;
    text-transform:uppercase;letter-spacing:.5px;padding:9px 14px;text-align:center;border-bottom:1px solid var(--line);
  }
  .meas-table td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:center;}
  .meas-table td.lbl{text-align:left;color:var(--txt-dim);}
  .meas-table tr:nth-child(even) td{background:var(--row-alt);}
  .meas-table .hl{color:var(--accent);font-weight:700;}
  .note{padding:12px 20px;color:var(--txt-dim);font-size:.84rem;line-height:1.5;border-bottom:1px solid var(--line);background:var(--row-alt);}
  .kv{padding:13px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:baseline;}
  .kv .k{color:var(--txt-dim);font-size:.86rem;flex:1;}
  .kv .v{font-weight:700;font-size:.92rem;text-align:right;white-space:nowrap;}
  /* refs accordion */
  .refs-head{
    display:flex;justify-content:space-between;align-items:center;padding:14px 20px;cursor:pointer;
    font-size:.7rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--txt-dim);font-weight:700;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg-elev);
  }
  .refs-body{display:none;padding:4px 0;}
  .refs-body.open{display:block;}
  .ref{padding:11px 20px;font-size:.78rem;color:var(--txt-dim);line-height:1.45;border-bottom:1px solid var(--line);}
  .ref i{color:var(--txt);}
  /* calc */
  .calc-box{padding:18px 20px;}
  .calc-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .calc-row label{font-size:.86rem;color:var(--txt-dim);min-width:54px;}
  .calc-row input{
    flex:1;background:var(--bg-elev);border:1px solid var(--line);color:var(--txt);
    padding:11px 13px;border-radius:10px;font-size:1rem;outline:none;font-family:inherit;
  }
  .calc-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .calc-row .unit{color:var(--txt-dim);font-size:.85rem;}
  .calc-btn{
    width:100%;background:var(--accent);color:#04201d;border:0;padding:13px;border-radius:11px;
    font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.5px;
  }
  .calc-btn:active{opacity:.8;}
  .calc-out{margin-top:18px;display:none;}
  .calc-out.show{display:block;}
  .calc-out .big{font-size:1.6rem;font-weight:800;color:var(--accent);text-align:center;margin:6px 0;}
  .calc-out .lab{text-align:center;color:var(--txt-dim);font-size:.8rem;}
  /* exam / technique */
  .pts{padding:10px 20px;}
  .pts li{font-size:.86rem;line-height:1.55;color:var(--txt);margin-bottom:9px;list-style:none;position:relative;padding-left:18px;}
  .pts li:before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--accent);}
  .tech-fig{padding:16px 20px;text-align:center;}
  .tech-fig svg{width:100%;max-width:300px;height:auto;}
  .tech-cap{color:var(--txt-dim);font-size:.78rem;margin-top:8px;}
  .us-img{margin:8px 20px 16px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000;}
  .us-img svg{display:block;width:100%;height:auto;}
  /* ---------- Bottom nav ---------- */
  .botnav{
    position:absolute;bottom:0;left:0;right:0;height:62px;display:flex;
    background:rgba(16,20,26,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .botnav button{
    flex:1;border:0;background:transparent;color:var(--txt-dim);font-family:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:.66rem;cursor:pointer;padding-top:6px;
  }
  .botnav button.on{color:var(--accent);}
  .botnav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  /* tabs in detail */
  .subtabs{
    position:absolute;bottom:62px;left:0;right:0;height:54px;display:flex;
    background:rgba(20,25,32,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  }
  .subtabs button{
    flex:1;border:0;background:transparent;color:var(--txt-dim);font-family:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:.64rem;cursor:pointer;
  }
  .subtabs button.on{color:var(--accent);}
  .subtabs svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .has-subtabs .scroll{padding-bottom:130px;}
  /* social/settings */
  .disc{margin:18px;padding:14px 16px;background:var(--accent-soft);border:1px solid #33b3a644;border-radius:12px;font-size:.78rem;color:var(--txt-dim);line-height:1.5;}
  .about{text-align:center;padding:30px 20px;color:var(--txt-dim);}
  .about .logo{width:62px;height:62px;margin:0 auto 10px;}
  .fade{animation:fade .22s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <div id="seg"></div>
  <div id="search"></div>
  <div class="scroll" id="scroll"></div>
  <div id="subtabs"></div>
  <nav class="botnav" id="botnav"></nav>
</div>

<noscript>
  <div style="color:#e8edf3;text-align:center;padding:40px 20px;font-family:sans-serif">
    RadRef precisa de JavaScript habilitado para funcionar.
  </div>
</noscript>

<script src="/js/config.js"></script>
<script src="/js/seed.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
