<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Entrar — KlugRads</title>
<meta name="robots" content="noindex">

<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0e1216">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KlugRads">

<style>
  :root{
    --bg:#0e1216; --sf:#161c23; --sf2:#1e2730; --line:#28323d;
    --tx:#e9eef3; --dim:#8b98a5; --accent:#15b8a6; --accentInk:#04221f;
    --accentSoft:#15b8a624; --erro:#f87171; --shadow:0 8px 24px rgba(0,0,0,.40);
    font-size:16px;
  }
  [data-theme="light"]{
    --bg:#eceff3; --sf:#ffffff; --sf2:#f3f6f9; --line:#e4e9ef;
    --tx:#16202a; --dim:#5e6c7a; --accent:#0f9e90; --accentInk:#ffffff;
    --accentSoft:#0f9e9024; --erro:#dc2626; --shadow:0 8px 24px rgba(20,40,60,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{margin:0;min-height:100%;}
  body{
    background:var(--bg); color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.5;
    display:flex; flex-direction:column; align-items:center;
    padding:26px 18px 40px;
  }
  .logo{font-size:20px;font-weight:800;letter-spacing:.14em;margin-bottom:22px;}
  .logo .k{color:var(--accent);}
  .card{
    width:100%; max-width:440px; background:var(--sf);
    border:1px solid var(--line); border-radius:18px;
    padding:22px; box-shadow:var(--shadow);
  }

  /* ---------- abas ---------- */
  .abas{display:flex;gap:6px;background:var(--sf2);border-radius:12px;padding:4px;margin-bottom:20px;}
  .aba{
    flex:1;text-align:center;padding:9px 8px;border-radius:9px;font-size:14px;
    font-weight:650;color:var(--dim);cursor:pointer;border:0;background:transparent;
    font-family:inherit;
  }
  .aba[aria-selected="true"]{background:var(--accent);color:var(--accentInk);}

  /* ---------- campos ---------- */
  .campo{margin-bottom:14px;}
  .campo > label{display:block;font-size:12.5px;font-weight:650;color:var(--dim);margin-bottom:6px;}
  .campo .req{color:var(--accent);}
  input, select{
    width:100%; font:inherit; font-size:15px; color:var(--tx);
    background:var(--sf2); border:1px solid var(--line); border-radius:11px;
    padding:12px 13px; outline:none;
  }
  input:focus, select:focus{border-color:var(--accent);}
  input::placeholder{color:var(--dim);opacity:.7;}
  .linha{display:flex;gap:10px;}
  .linha .campo{flex:1;margin-bottom:14px;}
  .linha .campo.uf{flex:0 0 108px;}

  /* olho mágico */
  .senha-wrap{position:relative;}
  .senha-wrap input{padding-right:46px;}
  .olho{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:36px;height:36px;display:grid;place-items:center;border:0;
    background:transparent;color:var(--dim);cursor:pointer;border-radius:8px;
  }
  .olho:hover{color:var(--tx);}
  .olho svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round;}

  .erro-campo{font-size:12px;color:var(--erro);margin-top:5px;}
  input[aria-invalid="true"], select[aria-invalid="true"]{border-color:var(--erro);}

  /* termos */
  .termos{display:flex;gap:10px;align-items:flex-start;margin:16px 0 4px;font-size:13px;color:var(--dim);}
  .termos input{width:18px;height:18px;flex:none;margin-top:1px;accent-color:var(--accent);}
  .termos a{color:var(--accent);}

  /* ---------- botões ---------- */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    font:inherit;font-weight:700;font-size:15px;border-radius:12px;padding:13px;
    border:1px solid transparent;cursor:pointer;text-decoration:none;
    transition:opacity .15s;
  }
  .btn:disabled{opacity:.55;cursor:default;}
  .btn-primary{background:var(--accent);color:var(--accentInk);margin-top:16px;}
  .btn-primary:not(:disabled):hover{opacity:.9;}
  .btn-google{background:var(--sf2);color:var(--tx);border-color:var(--line);}
  .btn-google:hover{background:var(--line);}
  .btn-google svg{width:18px;height:18px;}

  .ou{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--dim);font-size:12px;}
  .ou::before,.ou::after{content:"";flex:1;height:1px;background:var(--line);}

  .aviso-erro{
    background:#f8717118;border:1px solid var(--erro);color:var(--erro);
    border-radius:11px;padding:11px 13px;font-size:13.5px;margin-bottom:16px;
  }
  .aviso-ok{
    background:var(--accentSoft);border:1px solid var(--accent);color:var(--tx);
    border-radius:11px;padding:11px 13px;font-size:13.5px;margin-bottom:16px;
  }
  .rodape{
    max-width:440px;font-size:12px;color:var(--dim);text-align:center;
    margin-top:20px;line-height:1.6;
  }
  .rodape a{color:var(--dim);}
</style>
</head>
<body>

<a class="logo" href="/" style="text-decoration:none;color:inherit">
  <span class="k">KLUG</span>RADS
</a>

<div class="card">
  <div class="abas" role="tablist">
    <button class="aba" role="tab" id="aba-entrar" aria-selected="true" type="button">Entrar</button>
    <button class="aba" role="tab" id="aba-criar" aria-selected="false" type="button">Criar conta</button>
  </div>

  <div id="aviso" hidden></div>

  <!-- ============ ENTRAR ============ -->
  <form id="form-entrar" novalidate>
    <div class="campo">
      <label for="e-email">E-mail</label>
      <input type="email" id="e-email" autocomplete="email" inputmode="email" placeholder="voce@exemplo.com">
      <div class="erro-campo" id="err-e-email" hidden></div>
    </div>
    <div class="campo">
      <label for="e-senha">Senha</label>
      <div class="senha-wrap">
        <input type="password" id="e-senha" autocomplete="current-password" placeholder="••••••••">
        <button class="olho" type="button" data-alvo="e-senha" aria-label="Mostrar senha"></button>
      </div>
      <div class="erro-campo" id="err-e-senha" hidden></div>
    </div>
    <button class="btn btn-primary" type="submit" id="btn-entrar">Entrar</button>
  </form>

  <!-- ============ CRIAR CONTA ============ -->
  <form id="form-criar" novalidate hidden>
    <div class="campo">
      <label for="c-nome">Nome completo <span class="req">*</span></label>
      <input type="text" id="c-nome" autocomplete="name" placeholder="Maria Silva">
      <div class="erro-campo" id="err-c-nome" hidden></div>
    </div>

    <div class="campo">
      <label for="c-cpf">CPF <span class="req">*</span></label>
      <input type="text" id="c-cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" maxlength="14">
      <div class="erro-campo" id="err-c-cpf" hidden></div>
    </div>

    <div class="linha">
      <div class="campo">
        <label for="c-crm">CRM</label>
        <input type="text" id="c-crm" inputmode="numeric" placeholder="123456">
        <div class="erro-campo" id="err-c-crm" hidden></div>
      </div>
      <div class="campo uf">
        <label for="c-crm-uf">UF</label>
        <select id="c-crm-uf"><option value="">—</option></select>
      </div>
    </div>

    <div class="campo">
      <label for="c-telefone">Telefone <span class="req">*</span></label>
      <input type="tel" id="c-telefone" inputmode="tel" autocomplete="tel" placeholder="(81) 99999-9999" maxlength="15">
      <div class="erro-campo" id="err-c-telefone" hidden></div>
    </div>

    <div class="campo">
      <label for="c-email">E-mail <span class="req">*</span></label>
      <input type="email" id="c-email" autocomplete="email" inputmode="email" placeholder="voce@exemplo.com">
      <div class="erro-campo" id="err-c-email" hidden></div>
    </div>

    <div class="campo">
      <label for="c-senha">Senha <span class="req">*</span></label>
      <div class="senha-wrap">
        <input type="password" id="c-senha" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
        <button class="olho" type="button" data-alvo="c-senha" aria-label="Mostrar senha"></button>
      </div>
      <div class="erro-campo" id="err-c-senha" hidden></div>
    </div>

    <div class="campo">
      <label for="c-senha2">Repetir senha <span class="req">*</span></label>
      <div class="senha-wrap">
        <input type="password" id="c-senha2" autocomplete="new-password" placeholder="Digite de novo">
        <button class="olho" type="button" data-alvo="c-senha2" aria-label="Mostrar senha"></button>
      </div>
      <div class="erro-campo" id="err-c-senha2" hidden></div>
    </div>

    <label class="termos">
      <input type="checkbox" id="c-termos">
      <span>Li e aceito os <a href="/app#termos" target="_blank" rel="noopener">Termos de Uso</a>
      e autorizo o tratamento dos meus dados conforme descrito.</span>
    </label>
    <div class="erro-campo" id="err-c-termos" hidden></div>

    <button class="btn btn-primary" type="submit" id="btn-criar">Criar conta</button>
  </form>

  <div class="ou">ou</div>

  <button class="btn btn-google" type="button" id="btn-google">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.65l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09a6.6 6.6 0 0 1 0-4.18V7.07H2.18a11 11 0 0 0 0 9.86l3.66-2.84z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/>
    </svg>
    Continuar com Google
  </button>
</div>

<div class="rodape">
  <strong>Ferramenta educacional.</strong> Não substitui o julgamento clínico.<br>
  <a href="/">Voltar ao início</a>
</div>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
