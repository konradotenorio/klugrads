# Gera o arquivo do modelo de idade óssea (ONNX) sem precisar de Python na sua máquina.
# Como usar: aba Actions > "Exportar modelo de idade óssea" > Run workflow.
# Ao terminar, baixe o artefato "modelo-idade-ossea" (zip) e envie os arquivos para o
# armazenamento escolhido (ver README do projeto / conversa). Nada é publicado automaticamente.
name: Exportar modelo de idade óssea

on:
  workflow_dispatch:

permissions:
  contents: read        # sem acesso de escrita e sem segredos neste job

jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências (torch CPU + demais)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r tools/idade-ossea/requirements.txt
      - name: Exportar e validar a rede contra o PyTorch original
        run: python tools/idade-ossea/export_model.py --output modelo-idade-ossea
      - uses: actions/upload-artifact@v4
        with:
          name: modelo-idade-ossea
          path: modelo-idade-ossea/
          retention-days: 14
